<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ルーレットアプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <h1>運試しルーレット</h1>

      <div id="result">結果はここに出るでやんす</div>

      <button id="spin-btn">ルーレットをまわす</button>

      <div id="action-area" class="hidden">
        <button id="retry-btn">もう一回まわす</button>
        <button id="share-btn">結果をシェアする</button>
      </div>
      <div id="toggle-area">
        <label>
          <input type="radio" name="area" value="tokyo" checked /> 東京版
        </label>
        <label>
          <input type="radio" name="area" value="yokohama" /> 横浜版
        </label>
        <label>
          <input type="radio" name="area" value="food" /> ご飯
        </label>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
